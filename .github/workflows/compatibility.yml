name: Compatibility APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned SDK packages
        shell: pwsh
        run: sdkmanager 'platforms;android-36' 'sources;android-35'
      - name: Core checks
        shell: pwsh
        run: ./scripts/test-core.ps1
      - name: Build Media3 preview APK
        shell: pwsh
        working-directory: android
        run: ./gradlew.bat --no-daemon assembleDebug assembleAndroidTest
      - name: Editor boundary tests
        shell: pwsh
        run: ./scripts/test-editor.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nook-tv-0.2.0-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
