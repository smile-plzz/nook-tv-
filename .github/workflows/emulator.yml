name: Android runtime smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation
        working-directory: android
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x180:rate=10 -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 -t 3 -c:v libx264 -profile:v baseline -pix_fmt yuv420p -c:a aac -movflags +faststart -shortest app/src/androidTest/assets/fixture.mp4
          sh gradlew --no-daemon assembleDebug assembleAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 10
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w com.ismail.nooktv.compat.test/com.ismail.nooktv.SmokeInstrumentation | tee smoke-result.txt
            adb logcat -d > android-logcat.txt
            grep -A 35 -B 3 -E 'FATAL EXCEPTION|Fatal signal|AndroidRuntime|FAIL:' android-logcat.txt || true
            grep 'PASS:' smoke-result.txt
            adb shell screencap -p /sdcard/nook-preview.png
            adb pull /sdcard/nook-preview.png nook-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: |
            smoke-result.txt
            android-logcat.txt
            nook-preview.png
